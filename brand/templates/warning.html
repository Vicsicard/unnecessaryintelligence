<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Requirements / status panel — dark spec sheet with warning rows.
     Params: kicker, title, s1..s6 as "label|value|level" (level: ok|warn|crit), foot */
  body{width:1080px;height:1920px;background:#0B0E14;font-family:Inter;
       display:flex;flex-direction:column;justify-content:center;padding:0 72px;position:relative}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff08 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff08 1px,transparent 1px);
       background-size:90px 90px}
  .kicker{font-size:26px;letter-spacing:12px;color:#F79009;text-transform:uppercase;margin-bottom:18px;position:relative}
  .title{font-size:64px;font-weight:600;color:#F5F7FA;letter-spacing:-2px;margin-bottom:48px;position:relative}
  .spec{display:flex;align-items:center;padding:30px 0;border-top:1px solid #ffffff14;position:relative;gap:24px}
  .lbl{font-size:38px;color:#98A2B3;flex:1}
  .val{font-size:38px;font-weight:600;color:#F5F7FA;text-align:right}
  .dot{width:18px;height:18px;border-radius:50%;background:#39C276;flex:none}
  .warn .dot{background:#F79009}.crit .dot{background:#F04438}
  .warn .val{color:#F79009}.crit .val{color:#F04438}
  .bar{position:relative;height:8px;background:#ffffff12;border-radius:4px;flex:0 0 200px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:#39C276;border-radius:4px}
  .warn .bar i{background:#F79009}.crit .bar i{background:#F04438}
  .foot{position:absolute;left:72px;bottom:64px;font-size:24px;color:#3A4457;letter-spacing:2px;max-width:820px;line-height:1.4}
</style></head>
<body>
  <div class="grid"></div>
  <div class="kicker" id="kicker">SYSTEM REQUIREMENTS</div>
  <div class="title" id="title">Known limitations</div>
  <div id="specs"></div>
  <div class="foot" id="foot">Unnecessary Intelligence accepts no liability for feelings hurt during standups.</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","foot"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
    const box = document.getElementById("specs");
    for (let i = 1; i <= 6; i++) {
      const r = q.get("s" + i);
      if (!r) continue;
      const [lbl, val, lvl] = r.split("|");
      const cls = lvl === "crit" ? "crit" : lvl === "warn" ? "warn" : "ok";
      const w = lvl === "crit" ? "12%" : lvl === "warn" ? "45%" : "92%";
      box.innerHTML += `<div class="spec ${cls}"><div class="dot"></div>
        <div class="lbl">${lbl||""}</div>
        <div class="bar"><i style="width:${w}"></i></div>
        <div class="val">${val||""}</div></div>`;
    }
  </script>
</body></html>
