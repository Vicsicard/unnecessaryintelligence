<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Transparent kinetic headline layer. Params: text, color (white|red|orange), size */
  body{width:1080px;height:280px;background:transparent;font-family:Inter;
       display:flex;align-items:center;justify-content:center}
  .h{font-weight:600;letter-spacing:-1px;text-align:center;line-height:1.05;
     text-shadow:0 4px 30px #00000090}
  .white{color:#F5F7FA}.red{color:#E5484D}.orange{color:#FF8C1A}
</style></head>
<body>
  <div class="h" id="h">HEADLINE</div>
  <script>
    const q = new URLSearchParams(location.search);
    const el = document.getElementById("h");
    el.textContent = q.get("text") || "HEADLINE";
    el.classList.add(q.get("color") || "white");
    el.style.fontSize = (q.get("size") || 108) + "px";
  </script>
</body></html>
