<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Breaking-news base plate (navy). Animated headline layers composite on top.
     Params: bug, alert */
  body{width:1080px;height:1920px;background:linear-gradient(160deg,#071A33 0%,#030E1F 100%);
       font-family:Inter;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff07 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff07 1px,transparent 1px);
       background-size:90px 90px}
  .alert{position:absolute;top:150px;left:72px;display:flex;align-items:center;gap:18px}
  .dot{width:20px;height:20px;border-radius:50%;background:#E5484D}
  .alert span{font-size:30px;letter-spacing:10px;color:#E5484D;font-weight:600;text-transform:uppercase}
  .rule{position:absolute;top:230px;left:72px;right:72px;height:1px;background:#ffffff1c}
  .bug{position:absolute;left:72px;bottom:64px;font-size:24px;letter-spacing:6px;color:#5C6B84}
  .bug b{color:#FF8C1A;font-weight:600}
</style></head>
<body>
  <div class="grid"></div>
  <div class="alert"><div class="dot"></div><span id="alert">Breaking</span></div>
  <div class="rule"></div>
  <div class="bug" id="bug"><b>UI</b>&nbsp;&nbsp;UNNECESSARY INTELLIGENCE NEWS</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["alert","bug"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
  </script>
</body></html>
