<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Transparent "+ add-on" pricing line (700×110). Params: text */
  body{width:700px;height:110px;background:transparent;font-family:Inter;
       display:flex;align-items:center}
  .line{font-size:44px;font-weight:600;color:#F5F7FA;letter-spacing:-0.5px;
       text-shadow:0 4px 24px #00000090}
  .line b{color:#FF8C1A;margin-right:18px}
</style></head>
<body>
  <div class="line"><b>+</b><span id="t">HEALTH INSURANCE</span></div>
  <script>
    const q = new URLSearchParams(location.search);
    const v = q.get("text"); if (v) document.getElementById("t").textContent = v;
  </script>
</body></html>
