<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Transparent enterprise price card (936×420). Params: plan, price, per */
  body{width:936px;height:420px;background:transparent;font-family:Inter;
       display:flex;align-items:center;justify-content:center}
  .card{width:100%;padding:48px 56px;border-radius:26px;text-align:center;
       background:#0E2240F2;border:2px solid #FF8C1A66;
       box-shadow:0 0 80px #FF8C1A22,0 24px 70px #00000080}
  .plan{font-size:28px;letter-spacing:8px;color:#FF8C1A;text-transform:uppercase;
       font-weight:600;margin-bottom:20px}
  .price{font-size:130px;font-weight:600;color:#F5F7FA;letter-spacing:-4px;line-height:1}
  .per{font-size:32px;color:#8A94A8;letter-spacing:6px;margin-top:14px}
</style></head>
<body>
  <div class="card">
    <div class="plan" id="plan">HUMANGPT ENTERPRISE PLAN</div>
    <div class="price" id="price">$84,000</div>
    <div class="per" id="per">PER YEAR</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["plan","price","per"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
  </script>
</body></html>
