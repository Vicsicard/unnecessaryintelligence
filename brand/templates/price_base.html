<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Pricing base plate. Params: kicker, title, foot */
  body{width:1080px;height:1920px;background:linear-gradient(160deg,#071A33 0%,#030E1F 100%);
       font-family:Inter;position:relative}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff07 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff07 1px,transparent 1px);
       background-size:90px 90px}
  .kicker{position:absolute;top:210px;left:72px;font-size:26px;letter-spacing:12px;
       color:#FF8C1A;text-transform:uppercase;font-weight:600}
  .title{position:absolute;top:264px;left:72px;right:72px;font-size:72px;
       font-weight:600;color:#F5F7FA;letter-spacing:-2px;line-height:1.02}
  .foot{position:absolute;left:72px;bottom:64px;font-size:24px;letter-spacing:2px;color:#5C6B84}
</style></head>
<body>
  <div class="grid"></div>
  <div class="kicker" id="kicker">Pricing</div>
  <div class="title" id="title">NO MONTHLY<br>SUBSCRIPTION</div>
  <div class="foot" id="foot">Enterprise deployments only.</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","foot"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
  </script>
</body></html>
