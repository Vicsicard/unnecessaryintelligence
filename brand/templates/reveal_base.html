<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Product-reveal base plate. Params: kicker, title, sub */
  body{width:1080px;height:1920px;background:linear-gradient(165deg,#071A33 0%,#030E1F 100%);
       font-family:Inter;position:relative;overflow:hidden}
  .glow{position:absolute;top:260px;left:50%;width:1300px;height:1300px;
       transform:translateX(-50%);border-radius:50%;
       background:radial-gradient(circle,#FF8C1A14 0%,transparent 60%)}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff07 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff07 1px,transparent 1px);
       background-size:90px 90px}
  .kicker{position:absolute;top:300px;left:0;right:0;text-align:center;
       font-size:30px;letter-spacing:14px;color:#FF8C1A;text-transform:uppercase;font-weight:600}
  .title{position:absolute;top:370px;left:0;right:0;text-align:center;
       font-size:120px;font-weight:600;color:#F5F7FA;letter-spacing:-4px}
  .title i{font-style:normal;color:#FF8C1A}
  .sub{position:absolute;top:540px;left:0;right:0;text-align:center;
       font-size:34px;color:#8A94A8;letter-spacing:1px}
  .foot{position:absolute;left:72px;bottom:64px;font-size:24px;letter-spacing:2px;color:#5C6B84}
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="kicker" id="kicker">Introducing</div>
  <div class="title" id="title">Human<i>GPT</i></div>
  <div class="sub" id="sub">The first AI replacement that's actually a person.</div>
  <div class="foot" id="foot">UI PRODUCT DIVISION / UNIT 01</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","sub","foot"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
  </script>
</body></html>
