<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Feature dashboard — dark product-UI panel, progressive rows.
     Params: kicker, r1..r6 as "name|sub|tag" (pipe-separated). */
  body{width:1080px;height:1920px;background:#0B0E14;font-family:Inter;
       display:flex;flex-direction:column;justify-content:center;padding:0 72px;position:relative}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff08 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff08 1px,transparent 1px);
       background-size:90px 90px}
  .kicker{font-size:26px;letter-spacing:12px;color:#2E5BFF;text-transform:uppercase;margin-bottom:18px;position:relative}
  .title{font-size:64px;font-weight:600;color:#F5F7FA;letter-spacing:-2px;margin-bottom:52px;position:relative}
  .row{display:flex;align-items:baseline;gap:28px;padding:34px 0;
       border-top:1px solid #ffffff14;position:relative}
  .idx{font-size:26px;color:#3A4457;font-weight:600;min-width:52px}
  .name{font-size:56px;font-weight:600;color:#F5F7FA;letter-spacing:-1.5px}
  .sub{font-size:30px;color:#667085;margin-top:10px;line-height:1.3}
  .tag{margin-left:auto;font-size:24px;letter-spacing:4px;color:#2E5BFF;
       border:1px solid #2E5BFF55;border-radius:999px;padding:8px 20px;white-space:nowrap;align-self:center}
  .tag.warn{color:#F79009;border-color:#F7900955}
  .foot{position:absolute;left:72px;bottom:64px;font-size:24px;color:#3A4457;letter-spacing:2px}
</style></head>
<body>
  <div class="grid"></div>
  <div class="kicker" id="kicker">FEATURE SET</div>
  <div class="title" id="title">What HumanGPT actually does</div>
  <div id="rows"></div>
  <div class="foot" id="foot">All benchmarks self-certified.</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","title","foot"]) {
      const v = q.get(id); if (v !== null) document.getElementById(id).innerHTML = v;
    }
    const rows = document.getElementById("rows");
    for (let i = 1; i <= 6; i++) {
      const r = q.get("r" + i);
      if (!r) continue;
      const [name, sub, tag] = r.split("|");
      const warn = (tag||"").startsWith("!");
      rows.innerHTML += `<div class="row"><div class="idx">0${i}</div>
        <div><div class="name">${name||""}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}</div>
        ${tag ? `<div class="tag${warn?" warn":""}">${tag.replace(/^!/,"")}</div>` : ""}</div>`;
    }
  </script>
</body></html>
