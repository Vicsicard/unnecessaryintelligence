<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  @font-face{font-family:Inter;src:url("../fonts/Inter-SemiBold.ttf");font-weight:600}
  *{margin:0;box-sizing:border-box}
  /* Dramatic product-launch title — dark field, oversized editorial type.
     States: pass line1 only, or line1+line2 (progressive reveal). */
  body{width:1080px;height:1920px;background:#0B0E14;font-family:Inter;
       display:flex;flex-direction:column;justify-content:center;padding:0 84px;
       position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;
       background-image:linear-gradient(#ffffff08 1px,transparent 1px),
                        linear-gradient(90deg,#ffffff08 1px,transparent 1px);
       background-size:90px 90px}
  .kicker{font-size:26px;letter-spacing:14px;color:#2E5BFF;text-transform:uppercase;
          margin-bottom:40px;position:relative}
  .h1{font-size:118px;font-weight:600;color:#F5F7FA;line-height:1.04;
      letter-spacing:-4px;position:relative}
  .h1 em{font-style:normal;color:#F79009}
  .h2{margin-top:44px;font-size:52px;font-weight:600;color:#667085;
      letter-spacing:-1px;line-height:1.15;position:relative}
  .h2 em{font-style:normal;color:#F5F7FA}
  .edge{position:absolute;left:84px;bottom:64px;font-size:22px;color:#3A4457;
        letter-spacing:3px;text-transform:uppercase}
</style></head>
<body>
  <div class="grid"></div>
  <div class="kicker" id="kicker">UNNECESSARY INTELLIGENCE — PRODUCT LAUNCH</div>
  <div class="h1" id="h1">AI replaced your employees.</div>
  <div class="h2" id="h2"></div>
  <div class="edge" id="edge">UI-001 / CONCEPT FILM</div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ["kicker","h1","h2","edge"]) {
      const v = q.get(id);
      if (v !== null) document.getElementById(id).innerHTML = v;
    }
    if (!q.get("h2")) document.getElementById("h2").style.display = "none";
  </script>
</body></html>
