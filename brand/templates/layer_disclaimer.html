<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("../fonts/Inter.ttf")}
  *{margin:0;box-sizing:border-box}
  /* Transparent corporate disclaimer (900×80). Params: text */
  body{width:900px;height:80px;background:transparent;font-family:Inter;
       display:flex;align-items:center;justify-content:center}
  .d{font-size:26px;font-style:italic;color:#8A94A8;text-align:center}
</style></head>
<body>
  <div class="d" id="d">Emotional support sold separately.</div>
  <script>
    const q = new URLSearchParams(location.search);
    const v = q.get("text"); if (v) document.getElementById("d").innerHTML = v;
  </script>
</body></html>
